<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/jpeg" href="img/image1.jpg">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Planner</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            P
        </div>


        <h1>
            Reset password
        </h1>


        <p class="auth-subtitle">

            Create a new password for

            <strong id="resetEmail">
                your account
            </strong>

        </p>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <form
            id="resetForm"
            class="auth-form"
        >

            <div class="auth-field">

                <label for="password">
                    New Password
                </label>


                <div class="password-row">

                    <input
                        id="password"
                        type="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="auth-field">

                <label for="confirmPassword">
                    Confirm Password
                </label>


                <div class="password-row">

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                id="resetButton"
                type="submit"
                class="auth-button"
            >
                Reset Password
            </button>

        </form>


        <div class="auth-footer">

            <a href="login.html">
                Back to Sign In
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="auth.js"
></script>

</body>

</html>
