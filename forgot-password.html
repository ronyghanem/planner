<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Planner</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            P
        </div>


        <h1>
            Forgot password?
        </h1>


        <p class="auth-subtitle">
            Enter your email address and
            we'll send you a password reset link.
        </p>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <form
            id="forgotForm"
            class="auth-form"
        >

            <div class="auth-field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                id="forgotButton"
                type="submit"
                class="auth-button"
            >
                Send Reset Link
            </button>

        </form>


        <div class="auth-footer">

            Remember your password?

            <a href="login.html">
                Back to Sign In
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="auth.js"
></script>

</body>

</html>
