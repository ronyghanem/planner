<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4f46e5"
    >

    <title>My Planner - Offline</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff
                );

            color: #0f172a;
        }

        .offline-card {

            width: 100%;

            max-width: 430px;

            padding: 35px 25px;

            text-align: center;

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(
                    15,
                    23,
                    42,
                    0.1
                );
        }

        .icon {

            width: 65px;

            height: 65px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background: #eef2ff;

            font-size: 30px;
        }

        h1 {

            margin:
                0 0 10px;

            font-size: 24px;
        }

        p {

            margin: 0;

            color: #64748b;

            line-height: 1.6;

            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="offline-card">

        <div class="icon">
            📋
        </div>

        <h1>
            My Planner
        </h1>

        <p>
            You are currently offline.
            Your saved planner data will
            be available when the application
            is loaded.
        </p>

    </div>

</body>

</html>
